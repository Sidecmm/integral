name: Android ARM64 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-arm64:
    name: Build arm64-v8a (NEON + sse2neon)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Fetch sse2neon
        run: |
          git clone --depth 1 https://github.com/DLTcollab/sse2neon.git third-party/sse2neon

      - name: Configure CMake
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NATIVE=OFF \
            -DBUILD_NEON_ANDROID=ON \
            -DUSE_SSE2NEON=ON

      - name: Build
        run: cmake --build build-android --config Release -j$(nproc)

      - name: Show binary info
        run: |
          file build-android/integral
          ls -la build-android/integral

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: integral-android-arm64-v8a
          path: build-android/integral
          if-no-files-found: error
